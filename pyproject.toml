[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alert-triage"
version = "0.2.4"
description = "AI-powered alert diagnosis for Docker Compose stacks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic-settings",
]

[project.urls]
Repository = "https://github.com/tylerwolf/alert-triage"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
# Broad exception catches around external calls (Discord, Prometheus,
# Alertmanager, Docker) are intentional resilience; failures are logged.
ignore = ["BLE001"]
